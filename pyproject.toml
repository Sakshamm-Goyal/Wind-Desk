# Vercel's Python builder installs from this file (it takes precedence over requirements.txt).
[project]
name = "winddesk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
